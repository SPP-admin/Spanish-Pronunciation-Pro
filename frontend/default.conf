server {
    listen 80;

    # This matches the directory structure created in the Dockerfile
    location /pronunciemos-app/ {
        root /usr/share/nginx/html;
        index index.html;
        # Crucial for React Router/Single Page App support
        try_files $uri $uri/ /pronunciemos-app/index.html;
    }

    # Redirect root requests to your app path
    location = / {
        return 301 /pronunciemos-app/;
    }

    # Standard fix for missing trailing slash
    location /pronunciemos-app {
        return 301 $scheme://$http_host$uri/;
    }
}